<?xml version="1.0" encoding="UTF-8"?>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Raven: Conversation Detail</title>
    <h:outputStylesheet name="css/style1.css"/>
</h:head>

<h:body>
    <ui:include src="dark-mode-init.xhtml"/>

    <f:view>
        <f:metadata>
            <f:viewParam name="jid" value="#{conversationBean.upload_id}"/>
            <f:viewParam name="c" value="#{conversationBean.selectedIndex}"/>
            <f:viewParam name="title" value="#{conversationBean.topicTitle}"/>
            <f:viewAction action="#{conversationBean.loadConversations}"/>
        </f:metadata>

        <div class="menu-container">
            <table class="keystone"><tr>
            <td class="logo">Raven Console</td>
            <td class="logo"><button class="hamburger" onclick="toggleMenu()">&#9776;</button></td>
            </tr></table>
            <div id="dropdown-menu" class="dropdown hidden">
                <a href="about.xhtml">About</a>
                <label class="toggle-label">
                    Dark Mode
                    <input type="checkbox" id="color-mode-toggle" onclick="toggleColorMode()"/>
                </label>
            </div>
        </div>

        <h1>#{conversationBean.topicTitle}</h1>
        <h2>Upload: #{conversationBean.upload_id}
            &#x2014; Conversation #{conversationBean.selectedIndex + 1}
            (#{conversationBean.selectedConversation.posts.size()} posts)</h2>

        <h:link value="Back to conversation list" outcome="view-conversations.xhtml">
            <f:param name="jid" value="#{conversationBean.upload_id}"/>
            <f:param name="title" value="#{conversationBean.topicTitle}"/>
        </h:link>

        <ui:include src="conversation-fragment.xhtml">
            <ui:param name="conversation" value="#{conversationBean.selectedConversation}"/>
            <ui:param name="highlightPostId" value=""/>
        </ui:include>

    </f:view>

    <ui:include src="color-mode-toggle-script.xhtml"/>

    <script type="text/javascript">
    //<![CDATA[
    function toggleMenu() {
        document.getElementById('dropdown-menu').classList.toggle('hidden');
    }
    //]]>
    </script>
</h:body>

</html>

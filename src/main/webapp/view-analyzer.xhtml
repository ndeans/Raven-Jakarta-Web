<?xml version="1.0" encoding="UTF-8"?>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

<h:head>
    <title>Raven: Post Analyzer</title>
    <h:outputStylesheet name="css/style1.css"/>
</h:head>

<h:body>
    <ui:include src="dark-mode-init.xhtml"/>

    <f:view>
        <f:metadata>
            <f:viewParam name="post_id" value="#{postAnalyzerBean.targetPostId}"/>
            <f:viewAction action="#{postAnalyzerBean.loadByPostId(postAnalyzerBean.targetPostId)}"/>
        </f:metadata>

        <div class="menu-container">
            <table class="keystone"><tr>
            <td class="logo">Raven Console</td>
            <td class="logo"><button class="hamburger" onclick="toggleMenu()">&#9776;</button></td>
            </tr></table>
            <div id="dropdown-menu" class="dropdown hidden">
                <a href="about.xhtml">About</a>
                <label class="toggle-label">
                    Dark Mode
                    <input type="checkbox" id="color-mode-toggle" onclick="toggleColorMode()"/>
                </label>
            </div>
        </div>

        <h1>Post Analyzer</h1>
        <h2>Post: #{postAnalyzerBean.targetPostId}</h2>

        <div class="analyzer-container">
            <div class="analyzer-left">
                <h:panelGroup rendered="#{postAnalyzerBean.selectedConversation ne null}">
                    <ui:include src="conversation-fragment.xhtml">
                        <ui:param name="conversation" value="#{postAnalyzerBean.selectedConversation}"/>
                        <ui:param name="highlightPostId" value="#{postAnalyzerBean.targetPostId}"/>
                    </ui:include>
                </h:panelGroup>
                <h:panelGroup rendered="#{postAnalyzerBean.selectedConversation eq null}">
                    <p class="analyzer-message">#{postAnalyzerBean.notFoundMessage}</p>
                </h:panelGroup>
            </div>
            <div class="analyzer-right">
                <p class="placeholder-text">Expression exploration coming soon.</p>
            </div>
        </div>

    </f:view>

    <ui:include src="color-mode-toggle-script.xhtml"/>

    <script type="text/javascript">
    //<![CDATA[
    function toggleMenu() {
        document.getElementById('dropdown-menu').classList.toggle('hidden');
    }

    document.addEventListener('DOMContentLoaded', function() {
        var el = document.querySelector('.post-highlighted');
        if (el) el.scrollIntoView({behavior: 'smooth', block: 'center'});
    });
    //]]>
    </script>
</h:body>

</html>

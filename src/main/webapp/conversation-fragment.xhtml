<?xml version="1.0" encoding="UTF-8"?>

<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:h="http://xmlns.jcp.org/jsf/html"
                 xmlns:f="http://xmlns.jcp.org/jsf/core"
                 xmlns:ui="http://xmlns.jcp.org/jsf/facelets">

    <h:panelGroup layout="block" styleClass="conversation-panel">

        <h:panelGroup layout="block" styleClass="post-card-context"
                      rendered="#{conversation.contextPost ne null}">
            <h:panelGroup layout="block" styleClass="post-header">
                <h:outputText value="#{conversation.contextPost.author}" styleClass="post-author"/>
                <h:outputText value=" [#{conversation.contextPost.postId}]" styleClass="post-id"/>
                <h:outputLink value="#{conversation.contextPost.link}" target="_blank" styleClass="post-link">OPP</h:outputLink>
            </h:panelGroup>
            <h:panelGroup layout="block" styleClass="post-content">
                <h:outputText value="#{conversation.contextPost.html}" escape="false"/>
            </h:panelGroup>
        </h:panelGroup>

        <ui:repeat value="#{conversation.posts}" var="post" varStatus="status">
            <h:panelGroup layout="block"
                          styleClass="#{status.index == 0 and conversation.contextPost eq null ? 'post-card-context' : 'post-card'}#{post.postId eq highlightPostId ? ' post-highlighted' : ''}">

                <h:panelGroup layout="block" styleClass="post-header">
                    <h:outputText value="#{post.author}" styleClass="post-author"/>
                    <h:outputText value=" [#{post.postId}]" styleClass="post-id"/>
                    <h:outputLink value="#{post.link}" target="_blank" styleClass="post-link">OPP</h:outputLink>
                    <h:link value="Analyze" outcome="view-analyzer.xhtml" styleClass="post-link">
                        <f:param name="post_id" value="#{post.postId}"/>
                    </h:link>
                </h:panelGroup>

                <h:panelGroup layout="block" styleClass="post-content">
                    <h:outputText value="#{post.html}" escape="false"/>
                </h:panelGroup>

            </h:panelGroup>
        </ui:repeat>

    </h:panelGroup>

</ui:composition>

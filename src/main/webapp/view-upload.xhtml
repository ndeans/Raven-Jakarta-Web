<?xml version="1.0" encoding="UTF-8"?>

<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

    <h:head>
        <title>Raven: Posts</title>
        <h:outputStylesheet name="css/style1.css"/>
    </h:head>

    <h:body>
        <script type="text/javascript">
        //<![CDATA[
        (function() {
            if (localStorage.getItem('ravenColorMode') === 'dark') {
                document.body.classList.add('dark');
            }
        })();
        //]]>
        </script>

        <f:view>
            <f:metadata>
                <f:viewParam name="jid" value="#{uploadBean.upload_id}"/>
                <f:viewAction action="#{uploadBean.loadPosts}"/>
            </f:metadata>

            <div class="menu-container">
                <table class="keystone"><tr>
                <td class="logo">Raven Console</td>
                <td class="logo"><button class="hamburger" onclick="toggleMenu()">&#9776;</button></td>
                </tr></table>
                <div id="dropdown-menu" class="dropdown hidden">
                    <a href="about.xhtml">About</a>
                    <label class="toggle-label">
                        Dark Mode
                        <input type="checkbox" id="color-mode-toggle" onclick="toggleColorMode()"/>
                    </label>
                </div>
            </div>

            <h1>Upload: #{uploadBean.upload_id}</h1>
            <h2>"#{uploadBean.topic_title}"</h2>
            <div class="table-scroll">
                <h:form>
                    <h:dataTable
                            value="#{uploadBean.postList}"
                            var="post"
                            columnClasses="">
                        <h:column>
                            <f:facet name="header"/>
                            <h:selectBooleanCheckbox value="#{post.selected}" />
                        </h:column>
                        <h:column>
                            <f:facet name="header">topic_id</f:facet>
                            #{post.topic_id}
                        </h:column>
                        <h:column>
                            <f:facet name="header">upload_id </f:facet>
                            #{post.upload_id}
                        </h:column>
                        <h:column>
                            <f:facet name="header">author</f:facet>
                            #{post.author}
                        </h:column>
                        <h:column>
                            <f:facet name="header">text</f:facet>
                            #{post.text}
                        </h:column>
                    </h:dataTable>
                </h:form>
            </div>
        </f:view>

        <script type="text/javascript">
        //<![CDATA[
        function toggleColorMode() {
            var isDark = document.body.classList.toggle('dark');
            localStorage.setItem('ravenColorMode', isDark ? 'dark' : 'light');
        }
        function toggleMenu() {
            document.getElementById('dropdown-menu').classList.toggle('hidden');
        }
        var toggle = document.getElementById('color-mode-toggle');
        if (toggle) toggle.checked = (localStorage.getItem('ravenColorMode') === 'dark');
        //]]>
        </script>
    </h:body>

</html>
